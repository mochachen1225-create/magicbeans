<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3dcb4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="爬上魔豆、躲過媽媽和巨人，搶走金蛋！">
<title>傑克與魔豆</title>
<style>
:root{--paper:#fff8ea;--ink:#5a3a22;--accent:#e2733f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f3dcb4;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;overflow:hidden;background:#bfe3f0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0 34px;display:flex;align-items:center;gap:8px;pointer-events:none}
.chip{background:var(--paper);border-radius:14px;padding:6px 12px;font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(120,70,30,.18),0 6px 12px rgba(120,70,30,.15)}
#timer{font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
#coins{color:#b7791f;font-size:15px;display:none}
#mute{margin-left:auto;pointer-events:auto;border:0;font-size:20px;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1}
#hint,#chant{position:absolute;left:50%;transform:translateX(-50%) rotate(-1.2deg);background:var(--paper);padding:10px 16px;border-radius:14px;font-weight:800;font-size:18px;text-align:center;width:max-content;max-width:88%;box-shadow:0 3px 0 rgba(120,70,30,.18),0 8px 16px rgba(120,70,30,.18);opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.4}
#hint{top:calc(env(safe-area-inset-top) + 62px)}
#chant{top:calc(env(safe-area-inset-top) + 118px);font-size:26px;letter-spacing:2px;transform:translateX(-50%) rotate(1deg);color:#7a3d8a}
#hint.on,#chant.on{opacity:1}
.panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(90,58,34,.28)}
.panel.on{display:flex}
.card{background:var(--paper);border-radius:24px;padding:26px 22px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 0 rgba(120,70,30,.15),0 14px 30px rgba(90,50,20,.3);position:relative;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.card:before{content:"";position:absolute;inset:8px;border:2px dashed rgba(180,120,70,.35);border-radius:18px;pointer-events:none}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 4px;font-size:40px;letter-spacing:4px;color:#3f7a2c;text-shadow:0 3px 0 #fff,0 5px 0 rgba(120,70,30,.2)}
h2{margin:0 0 6px;font-size:26px;color:#3f7a2c}
.sub{font-size:16px;margin:0 0 10px;opacity:.85}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:20px;font-weight:900;color:#fff;background:var(--accent);box-shadow:0 5px 0 #b5552a;margin-top:12px;font-family:inherit;cursor:pointer;position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b5552a}
.btn.green{background:#5aa63f;box-shadow:0 5px 0 #3f7a2c}
.btn.green:active{box-shadow:0 2px 0 #3f7a2c}
.btn.ghost{background:#efe2c8;color:var(--ink);box-shadow:0 5px 0 #d4c09c;font-size:17px;padding:11px}
.btn.ghost:active{box-shadow:0 2px 0 #d4c09c}
.quote{font-size:24px;font-weight:900;line-height:1.45;margin:10px 0 8px}
.reason{display:inline-block;background:#f6d4b8;border-radius:10px;padding:3px 10px;font-size:14px;font-weight:700}
.big{font-size:58px;font-weight:900;color:#d9622b;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:22px}
.detail{font-size:14px;opacity:.8;margin:2px 0 6px}
.best{font-size:16px;font-weight:800;margin:4px 0}
.badge{display:inline-block;background:#ffd25e;color:#7a4a10;border-radius:10px;padding:3px 10px;font-weight:900;font-size:15px;transform:rotate(-3deg);margin-bottom:4px}
.how{text-align:left;font-size:14.5px;line-height:1.65;background:#f7ecd6;border-radius:12px;padding:10px 12px;margin:8px 0 2px}
.how b{color:#c4562a}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:#5a3a22;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="chip" id="timer">0.0 秒</div>
    <div class="chip" id="coins">金幣 0</div>
    <button class="chip" id="mute" aria-label="靜音">🔊</button>
  </div>
  <div id="hint"></div>
  <div id="chant"></div>

  <div class="panel on" id="pTitle"><div class="card">
    <h1>傑克與魔豆</h1>
    <p class="sub">爬上魔豆、躲過媽媽，搶走巨人的金蛋！</p>
    <div class="how">
      ① 點土地種下魔豆<br>
      ② 手指<b>左右交替往上滑</b>爬藤（太快會滑手）<br>
      ③ <b>左右橫滑</b>換到另一根藤：閃小鳥、躲斷藤、撿金幣<br>
      ④ 大風來時<b>按住螢幕不要動</b><br>
      ⑤ 巨人背對時<b>按住前進</b>，轉頭就<b>放開</b>！
    </div>
    <div class="best" id="tBest"></div>
    <button class="btn green" id="bStart">開始</button>
    <button class="btn ghost" id="bGame2">分享遊戲給朋友</button>
  </div></div>

  <div class="panel" id="pFail"><div class="card">
    <span class="reason" id="fReason"></span>
    <div class="quote" id="fQuote"></div>
    <div class="detail" id="fDetail"></div>
    <button class="btn" id="bRetry">再來一次</button>
  </div></div>

  <div class="panel" id="pWin"><div class="card">
    <div class="badge" id="wNew">新紀錄！</div>
    <h2>拿到金蛋了！</h2>
    <div class="big" id="wTime">0.0<small> 秒</small></div>
    <div class="detail" id="wDetail"></div>
    <div class="best" id="wBest"></div>
    <button class="btn green" id="bShare">分享成績截圖</button>
    <button class="btn" id="bAgain">再玩一次</button>
    <button class="btn ghost" id="bGame">分享遊戲給朋友</button>
  </div></div>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const wrap = $('wrap'), cv = $('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
const TOP = 90;          // 魔豆高度（公尺）
const SW = 0.22;         // 換藤時間
let W = 390, H = 760, DPR = 1, PX = 47, U = 1, Yj = 420;

// ---------- 小工具 ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; }

// ---------- 音效 ----------
let AC = null, muted = LS.get('jack_mute', '0') === '1', noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = .2, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, v = .2, f1 = 800, f2 = 800, delay = 0, q = 1) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = 'bandpass'; fl.Q.value = q;
  fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(.3, d * .3)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  pop() { tone(260, .15, 'sine', .35, 620); },
  whoosh() { noise(1.4, .35, 300, 4000, 0, .7); tone(140, 1.3, 'triangle', .12, 900); },
  climb(s) { tone(s ? 600 : 500, .07, 'triangle', .13, s ? 700 : 580); noise(.06, .08, 2500, 2000); },
  coin() { tone(988, .07, 'square', .08); tone(1319, .22, 'square', .08, null, .07); },
  tweet() { tone(2300, .07, 'sine', .12, 3100); tone(2500, .07, 'sine', .12, 3300, .1); },
  crack() { noise(.3, .5, 1800, 300, 0, .8); tone(180, .25, 'sawtooth', .12, 60); },
  windWarn() { noise(1.4, .12, 300, 600, 0, .6); },
  wind() { noise(2.6, .3, 500, 900, 0, .5); },
  slip() { tone(520, .35, 'sawtooth', .1, 140); },
  swish() { noise(.15, .15, 1200, 3000, 0, 1); },
  step() { tone(150, .06, 'sine', .15, 90); },
  turn() { tone(220, .18, 'square', .08, 330); tone(330, .3, 'square', .08, 494, .16); },
  door() { tone(300, .12, 'square', .08, 200); tone(700, .25, 'square', .08, 500, .12); },
  dodge() { tone(880, .1, 'sine', .12, 1200); },
  fail() { tone(392, .22, 'triangle', .22, 380); tone(370, .22, 'triangle', .22, 350, .24); tone(349, .6, 'triangle', .22, 260, .48); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .5 : .18, 'triangle', .2, null, i * .11)); }
};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- 繪圖小工具（剪紙風：每片都有柔和陰影） ----------
function sh(on = true) {
  if (on) { ctx.shadowColor = 'rgba(110,60,20,.28)'; ctx.shadowBlur = 6 * U * DPR; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 3 * U * DPR; }
  else { ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rr(x, y, w, h, r, fill, s = true) { sh(s); ctx.fillStyle = fill; rrPath(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, fill, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, fill, rot = 0, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function poly(pts, fill, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function limb(x1, y1, x2, y2, col, w, s = true) { sh(s); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function star(x, y, r, fill) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, false);
}
function archPath(x, y, w, h, fill) {
  sh(); ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + w / 2);
  ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
}
function text(s, x, y, size, fill, stroke = '#fff8ea', align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  sh(false);
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size * .28; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function bubble(x, y, s, size = 17) {
  size *= U; ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(s).width + 24 * U, h = size + 18 * U;
  const bx = clamp(x - w / 2, 8, W - w - 8);
  sh(); ctx.fillStyle = '#fff8ea'; rrPath(bx, y - h, w, h, 12 * U); ctx.fill();
  poly([[x - 7 * U, y - 2], [x + 7 * U, y - 2], [x, y + 9 * U]], '#fff8ea', false);
  text(s, bx + w / 2, y - h / 2, size, '#5a3a22', null);
}

// ---------- 預先畫好的紙片圖層 ----------
let IMG = {};
function make(w, h, fn) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
  const old = ctx; ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); fn(w, h); ctx = old;
  c.w = w; c.h = h; return c;
}
function paintCloud(w, h) {
  sh(); ctx.fillStyle = '#ffffff'; ctx.beginPath();
  [[.24, .62, .17], [.42, .45, .22], [.62, .48, .2], [.8, .64, .14], [.5, .68, .2]].forEach(([x, y, r]) => { ctx.moveTo(w * x + r * w, h * y); ctx.arc(w * x, h * y, r * w, 0, Math.PI * 2); });
  ctx.fill();
  sh(false); ctx.fillStyle = 'rgba(255,240,225,.6)'; ctx.beginPath(); ctx.ellipse(w * .52, h * .78, w * .3, h * .08, 0, 0, Math.PI * 2); ctx.fill();
}
function paintFar(w, h) {
  const rows = [['#bfe0c4', .35, .1, 0], ['#a3d2a9', .55, .08, 2]];
  rows.forEach(([c, b, a, ph]) => {
    sh(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, h);
    for (let x = 0; x <= w + 10; x += 8) ctx.lineTo(x, h * b + Math.sin(x * .011 + ph) * h * a + Math.sin(x * .029 + ph) * h * .04);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  });
  for (let i = 0; i < 9; i++) { const x = (i + .5) / 9 * w + Math.sin(i * 7) * 10; circ(x, h * .58 + Math.sin(x * .011 + 2) * h * .08 - 6 * U, 7 * U, '#8cc394'); }
}
function paintVillage(w, h) {
  const gy = h * .78;
  sh(); ctx.fillStyle = '#b4d993'; ctx.beginPath(); ctx.moveTo(0, h);
  for (let x = 0; x <= w + 10; x += 8) ctx.lineTo(x, gy + Math.sin(x * .02) * 5); ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  const roofs = ['#e3958a', '#eab07a', '#c99088', '#e6a37f'];
  [.07, .21, .58, .73, .9].forEach((f, i) => {
    const x = f * w, s = .7 * U, bw = 34 * s, bh = 26 * s, y = gy + Math.sin(x * .02) * 5;
    rr(x - bw / 2, y - bh, bw, bh + 3, 3, '#f8e9cf');
    poly([[x - bw / 2 - 5 * s, y - bh + 2], [x, y - bh - 20 * s], [x + bw / 2 + 5 * s, y - bh + 2]], roofs[i % 4]);
    rr(x - 4 * s, y - 13 * s, 8 * s, 13 * s, 2, '#a9785a', false);
  });
  [.14, .33, .46, .66, .82, .97].forEach(f => {
    const x = f * w, y = gy + Math.sin(x * .02) * 5;
    rr(x - 2 * U, y - 16 * U, 4 * U, 16 * U, 2, '#a9785a', false); circ(x, y - 22 * U, 11 * U, '#86c070');
  });
}
function paintGround(w, h) {
  const gy = h * .3;
  const bands = [['#a6d47c', 0, 4], ['#90c76a', .1, 5], ['#7fb85c', .26, 6]];
  bands.forEach(([c, o, a]) => {
    sh(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, h);
    for (let x = 0; x <= w + 10; x += 8) ctx.lineTo(x, gy + o * h + Math.sin(x * .045 + o * 9) * a);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  });
  for (let i = 0; i < 26; i++) { const x = (i * 97 % 100) / 100 * w, y = gy + 12 + ((i * 53) % 100) / 100 * h * .24; circ(x, y, 3 * U, ['#ffd36b', '#ff9e8a', '#ffffff'][i % 3], false); }
  // 傑克家
  const hx = w * .03, hw = w * .31, hh = h * .12;
  rr(hx + hw * .68, gy - hh - hh * .62, 14 * U, hh * .5, 3, '#c98a5c');
  rr(hx, gy - hh, hw, hh + 4, 6 * U, '#fbe6c4');
  poly([[hx - 10 * U, gy - hh + 6], [hx + hw / 2, gy - hh - hh * .72], [hx + hw + 10 * U, gy - hh + 6]], '#d9974c');
  sh(false); ctx.strokeStyle = '#c47f38'; ctx.lineWidth = 2 * U;
  for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(hx + hw / 2, gy - hh - hh * .72); ctx.lineTo(hx - 10 * U + (hw + 20 * U) * i / 5, gy - hh + 6); ctx.stroke(); }
  const dx = w * .19;
  rr(dx - 12 * U, gy - 36 * U, 24 * U, 37 * U, 9 * U, '#8a5a3c');
  circ(dx + 6 * U, gy - 18 * U, 2 * U, '#f2c14e', false);
  rr(hx + hw * .07, gy - hh * .78, 24 * U, 21 * U, 4 * U, '#8fcbe3');
  limb(hx + hw * .07 + 12 * U, gy - hh * .78, hx + hw * .07 + 12 * U, gy - hh * .78 + 21 * U, '#fbe6c4', 2 * U, false);
  // 柵欄
  for (let x = w * .86; x < w + 10; x += 15 * U) rr(x, gy - 24 * U, 8 * U, 26 * U, 3 * U, '#efd1a5');
  rr(w * .85, gy - 17 * U, w * .16, 5 * U, 2, '#e3c08f');
}
function paintCastle(w, h) {
  const stone = '#d7c8ea', stoneD = '#bfaedb', roof = '#e07a6a';
  rr(w * .06, h * .3, w * .2, h * .7 + 2, 6, stone); rr(w * .74, h * .3, w * .2, h * .7 + 2, 6, stone);
  [.16, .84].forEach(f => {
    limb(w * f, h * .09, w * f, h * .01, '#8a5a3c', 2.5);
    poly([[w * f, h * .01], [w * f + 18 * U, h * .03], [w * f, h * .055]], '#ffcf5a');
    poly([[w * (f - .13), h * .33], [w * f, h * .09], [w * (f + .13), h * .33]], roof);
    archPath(w * f - 8 * U, h * .45, 16 * U, 24 * U, '#6b4a7a');

function stroke(side) {

  if (G.lastSide === side) { hint('換另一隻手！左右交替', .9); return; }
  G.lastSide = side; G.arm = side;
  G.heat += 18;
  if (G.heat > 100) { slip(); return; }
  const prev = G.h, nh = Math.min(TOP, prev + 1.4);
  for (const b of G.breaks) if (b.stalk === G.stalk && prev < b.h && nh >= b.h - .3) { snapBreak(b); return; }

}

}

}

  if (G.breaks.some(b => b.stalk === to && G.h > b.h - .6 && G.h < b.h + 1.8)) { hint('那邊斷掉了！', .8); return; }
  G.from = G.stalk; G.stalk = to; G.switchT = SW; SFX.swish();

  else if (g.state === 'turnback') { const u = clamp(g.t / .35, 0, 1); sx = Math.max(.06, Math.abs(Math.cos(u * Math.PI))); face = u < .5 ? 'front' : 'back'; }
  if (scene === 'fail') { face = 'front'; sx = 1; }
  const jy = lerp(H * .9, H * .555, g.p), js = lerp(1.2, .62, g.p), jx = lerp(W * .42, W * .5, g.p);
  const gx = W * .73, gfy = H * .64, gh = H * .4;
  const drawJ = () => {
    if (scene === 'win') {
      const s = js; drawJack(jx, jy, s, 'hold', 0);
      drawEgg(jx, jy - 52 * U * s, s * 1.1, T);
      for (let i = 0; i < 5; i++) { const a = T * 2 + i * 1.256; star(jx + Math.cos(a) * 46 * U, jy - 30 * U + Math.sin(a) * 30 * U, 6 * U, '#ffd25e'); }
    } else {
      let ox = scene === 'fail' ? Math.sin(T * 40) * 3 : 0;
      drawJack(jx + ox, jy, js, 'walk', g.walk);
    }
  };
  if (jy + 27 * U * js > gfy) { drawGiant(gx, gfy, gh, face, sx, T, -1); drawJ(); }
  else { drawJ(); drawGiant(gx, gfy, gh, face, sx, T, -1); }
  if (g.state === 'turning' && g.t > .1) bubble(gx - 20 * U, gfy - gh - 4 * U, '嗯？', 20);
  if (scene === 'fail') bubble(gx - 30 * U, gfy - gh - 4 * U, '嘿嘿嘿！', 20);
  if (g.state === 'front' && scene === 'giant') {
    const a = .25 + .12 * Math.sin(T * 10);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
    vg.addColorStop(0, 'rgba(200,40,30,0)'); vg.addColorStop(1, `rgba(200,40,30,${a})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (scene === 'giant') {
    const by = H - 84, front = g.state === 'front';
    rr(W / 2 - 110, by, 220, 56, 20, front ? 'rgba(229,83,61,.92)' : `rgba(255,222,130,${.8 + .15 * Math.sin(T * 6)})`, false);
    text(front ? '放開！不要動！' : (g.moving ? '前進中…' : '按住前進'), W / 2, by + 28, 20, front ? '#fff' : '#5a3a22', null);
    rr(W * .2, by - 20, W * .6, 8, 4, 'rgba(255,248,234,.8)', false);
    rr(W * .2, by - 20, Math.max(8, W * .6 * g.p), 8, 4, '#f2b93b', false);

}
function render() {
  ctx = mainCtx; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shakeT > 0) { const m = 7 * Math.min(1, shakeT * 3); ctx.translate(rnd(-m, m), rnd(-m, m)); }
  if (G.inGiant) drawGiantScene(); else drawWorld();
  ctx.restore();
  if (fadeA > 0) { ctx.fillStyle = `rgba(255,250,240,${fadeA})`; ctx.fillRect(0, 0, W, H); }
}
let lastTimer = '', lastCoins = -1;
function hud() {
  const show = ['climb', 'toGiant', 'giant', 'fail', 'win', 'mom'].includes(scene);
  const t = show ? fmt(G.time) + ' 秒' : '';
  $('timer').style.visibility = show ? 'visible' : 'hidden';
  if (t !== lastTimer) { $('timer').textContent = t; lastTimer = t; }
  if (G.bonus !== lastCoins) { lastCoins = G.bonus; $('coins').style.display = G.bonus ? 'block' : 'none'; $('coins').textContent = `金幣 −${G.bonus} 秒`; }
}

// ---------- 主迴圈 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.ev && G.ev.type === 'wind') G.lastWindDir = G.ev.dir;
  update(dt); render(); hud();
  requestAnimationFrame(frame);
}

// ---------- 按鈕 ----------
$('bStart').onclick = () => { audio(); startRun(false); };
$('bRetry').onclick = () => { audio(); startRun(true); };
$('bAgain').onclick = () => { audio(); startRun(true); };
$('mute').onclick = () => { muted = !muted; LS.set('jack_mute', muted ? '1' : '0'); setMute(); audio(); };
const GAME_URL = () => location.href.split('#')[0].split('?')[0];
function copyText(all) {
  const ok = () => toast('已複製！貼到 LINE 給朋友吧');
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(all).then(ok).catch(() => legacyCopy(all, ok));
  legacyCopy(all, ok);
}
function legacyCopy(all, ok) {
  const ta = document.createElement('textarea'); ta.value = all; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch (_) { toast(all); }
  ta.remove();
}
// 成績卡（剪紙風圖片）
function resultCard() {
  const w = 720, h = 960, oldU = U;
  U = 2;
  const c = make(w, h, () => {
    const gr = ctx.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#f4ad8e'); gr.addColorStop(.6, '#ffe0b8'); gr.addColorStop(1, '#fff3e0');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
    circ(600, 120, 60, '#ffe39a', false);
    ctx.drawImage(IMG.cloud, -60, 40, 360, 195); ctx.drawImage(IMG.cloud, 440, 220, 320, 173);
    { const cw = 440, chh = IMG.castle.h * cw / IMG.castle.w; ctx.drawImage(IMG.castle, (w - cw) / 2, 330 - chh, cw, chh); }
    for (let i = -1; i < 5; i++) ctx.drawImage(IMG.cloud, i * 170 - 20, 280, 300, 162);
    rr(50, 380, 620, 520, 40, '#fff8ea');
    sh(false); ctx.setLineDash([12, 10]); ctx.strokeStyle = 'rgba(180,120,70,.4)'; ctx.lineWidth = 4; rrPath(66, 396, 588, 488, 30); ctx.stroke(); ctx.setLineDash([]);
    drawJack(150, 800, 1.6, 'hold', 0); drawEgg(150, 800 - 54 * 3.2, 1.7, 1);
    text('傑克與魔豆', w / 2, 450, 58, '#3f7a2c');
    text('我只花了', w / 2 + 50, 545, 34, '#5a3a22', null);
    text(fmt(G.final) + ' 秒', w / 2 + 60, 640, 112, '#d9622b');
    text('就從巨人家偷到金蛋！', w / 2 + 60, 740, 34, '#5a3a22', null);
    if (G.newBest) { ctx.save(); ctx.translate(560, 392); ctx.rotate(.12); rr(-90, -28, 180, 56, 14, '#ffd25e'); text('新紀錄！', 0, 0, 32, '#7a4a10', null); ctx.restore(); }
    text('你能比我快嗎？', w / 2 + 60, 820, 30, '#c4562a', null);
    text(GAME_URL().replace(/^https?:\/\//, ''), w / 2, 935, 22, 'rgba(90,58,34,.75)', null);
  });
  U = oldU;

}
let cardBlob = null;
function prepareCard() {
  cardBlob = null;
  try { resultCard().toBlob(b => { cardBlob = b; }, 'image/png'); } catch (e) {}
}
$('bShare').onclick = async () => {
  const url = GAME_URL();
  const msg = `我在《傑克與魔豆》只花 ${fmt(G.final)} 秒就從巨人家偷到金蛋！你能比我快嗎？`;
  if (cardBlob && navigator.canShare) {
    const file = new File([cardBlob], 'jack-beanstalk.png', { type: 'image/png' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: msg + ' ' + url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  if (navigator.share) {
    try { await navigator.share({ title: '傑克與魔豆', text: msg, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (cardBlob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(cardBlob); a.download = 'jack-beanstalk.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  copyText(msg + ' ' + url);
};
