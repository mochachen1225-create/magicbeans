<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="爬上魔豆、躲過媽媽和巨人，搶走金蛋！">
<title>傑克與魔豆</title>
<style>
:root{--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .3 0 0 0 0 .45 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");--ink:#6b4a5a;--pink:#f7a1bf;--pinkD:#ec7fa6;--blue:#9fd3f5;--blueD:#6fb6e6;--yellow:#ffe59a;--cream:#fffaf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#ffe3ee,#e3f1ff);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;overflow:hidden;background:#cfe9ff;box-shadow:0 0 40px rgba(214,120,160,.18)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0 34px;display:flex;align-items:center;gap:8px;pointer-events:none}
.chip{background:var(--grain),linear-gradient(180deg,#fffefb,#fff0f5);border-radius:18px;padding:7px 14px;font-weight:800;font-size:18px;color:var(--ink);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(214,120,160,.2),0 1px 2px rgba(150,80,110,.12)}
#timer{font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
#coins{color:#c98a1a;font-size:15px;display:none;background:linear-gradient(180deg,#fffdf0,#fff1c4)}
#mute{margin-left:auto;pointer-events:auto;font-size:20px;cursor:pointer;font-family:inherit;line-height:1}
#hint,#chant{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);background:linear-gradient(180deg,#fffefb,#fff1f6);padding:10px 18px;border-radius:18px;font-weight:800;font-size:18px;text-align:center;width:max-content;max-width:88%;border:1px solid #fff;box-shadow:0 6px 18px rgba(214,120,160,.22),0 1px 3px rgba(150,80,110,.12);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;line-height:1.4}
#hint{top:calc(env(safe-area-inset-top) + 62px)}
#chant{top:calc(env(safe-area-inset-top) + 118px);font-size:26px;letter-spacing:2px;transform:translateX(-50%) rotate(1deg);color:#9b6fd0;background:linear-gradient(180deg,#fffefb,#f1ecff)}
#hint.on,#chant.on{opacity:1}
.panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(255,214,230,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel.on{display:flex}
.card{background:var(--grain),linear-gradient(180deg,#fffefb 0%,#fff6f9 60%,#fff2f6 100%);border-radius:30px;padding:26px 22px 20px;width:100%;max-width:360px;text-align:center;border:1px solid #fff;box-shadow:inset 0 2px 0 #fff,8px 10px 0 #ffd6e4,14px 18px 0 #d9ecff,0 26px 44px rgba(214,110,150,.28),0 4px 10px rgba(150,80,110,.12);position:relative;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.card:before{content:"";position:absolute;inset:9px;border:2px dashed #f9cadb;border-radius:22px;pointer-events:none}
@keyframes pop{from{transform:scale(.75) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 4px;font-size:40px;letter-spacing:4px;background:linear-gradient(180deg,#f79cbd,#c58ae0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 4px 6px rgba(214,110,150,.25))}
h2{margin:0 0 4px;font-size:26px;color:#e0679a}
.sub{font-size:16px;margin:0 0 10px;opacity:.85}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:14px;font-size:20px;font-weight:900;color:#fff;letter-spacing:1px;background:linear-gradient(180deg,#ffb9cf,#f388ad);text-shadow:0 1px 2px rgba(190,70,110,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 0 #e47aa0,0 10px 20px rgba(236,127,166,.3);margin-top:12px;font-family:inherit;cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #e47aa0,0 5px 10px rgba(236,127,166,.25)}
.btn.green{background:linear-gradient(180deg,#b6e2ff,#7cc2f0);text-shadow:0 1px 2px rgba(60,120,180,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 0 #64aedf,0 10px 20px rgba(111,182,230,.3)}
.btn.green:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #64aedf,0 5px 10px rgba(111,182,230,.25)}
.btn.ghost{background:linear-gradient(180deg,#fff7d1,#ffe596);color:#8a6a3a;text-shadow:none;font-size:17px;padding:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 5px 0 #f2cf6c,0 10px 18px rgba(240,200,96,.25)}
.btn.ghost:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 0 #f2cf6c}
.quote{font-size:24px;font-weight:900;line-height:1.45;margin:10px 0 8px}
.reason{display:inline-block;background:linear-gradient(180deg,#ffe6ef,#ffd3e2);color:#c2507e;border-radius:12px;padding:4px 12px;font-size:14px;font-weight:800}
.big{font-size:58px;font-weight:900;background:linear-gradient(180deg,#ff9fc0,#e86f9c);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:22px}
.ribbon{display:inline-block;margin:2px 0 6px;padding:6px 18px;border-radius:999px;background:linear-gradient(180deg,#e9f5ff,#cfe8ff);color:#4a86b8;font-weight:900;font-size:19px;box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(111,182,230,.25)}
.ribbon:before{content:"稱號：";font-size:14px;opacity:.8}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 4px}
.tags span{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,#fffbe6,#fff0b3);color:#a37a1c}
.detail{font-size:14px;opacity:.8;margin:2px 0 6px}
.best{font-size:16px;font-weight:800;margin:4px 0}
.badge{display:inline-block;background:linear-gradient(180deg,#fff7c2,#ffe27a);color:#b86a2a;border-radius:12px;padding:3px 12px;font-weight:900;font-size:15px;transform:rotate(-3deg);margin-bottom:4px;box-shadow:0 3px 8px rgba(240,200,96,.35)}
.how{text-align:left;font-size:14px;line-height:1.65;background:var(--grain),linear-gradient(180deg,#fffaf0,#fff3dc);border-radius:16px;padding:10px 14px;margin:8px 0 2px;box-shadow:inset 0 1px 0 #fff}
.how b{color:#e0679a}
.how .pc{font-size:12.5px;opacity:.7}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:linear-gradient(180deg,#9b7aa8,#7f5f8e);color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90%;box-shadow:0 8px 20px rgba(127,95,142,.3)}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="chip" id="timer">0.0 秒</div>
    <div class="chip" id="coins">金幣 0</div>
    <button class="chip" id="mute" aria-label="靜音">🔊</button>
  </div>
  <div id="hint"></div>
  <div id="chant"></div>

  <div class="panel on" id="pTitle"><div class="card">
    <h1>傑克與魔豆</h1>
    <p class="sub">爬上魔豆、躲過媽媽，搶走巨人的金蛋！</p>
    <div class="how">
      ① 點土地種下魔豆<br>
      ② 三根藤，<b>點傑克那一根</b>往上爬（點太快會滑手）<br>
      ③ <b>點別根藤</b>就跳過去：閃開小鳥、巫婆、綿羊、豌豆，繞過斷藤、毛毛蟲、蜂窩<br>
      ④ 熱氣球飄過來時<b>跳向它</b>就能搭上！<br>
      ⑤ 大風來時<b>按住不要動</b><br>
      ⑥ 巨人背對時<b>按住前進</b>，轉頭就<b>放開</b>！<br>
      <span class="pc">電腦也能玩：用滑鼠點擊、按住</span>
    </div>
    <div class="best" id="tBest"></div>
    <button class="btn green" id="bStart">開始</button>
    <button class="btn ghost" id="bGame2">分享遊戲給朋友</button>
  </div></div>

  <div class="panel" id="pFail"><div class="card">
    <span class="reason" id="fReason"></span>
    <div class="quote" id="fQuote"></div>
    <div class="detail" id="fDetail"></div>
    <button class="btn" id="bRetry">再來一次</button>
  </div></div>

  <div class="panel" id="pWin"><div class="card">
    <div class="badge" id="wNew">新紀錄！</div>
    <h2>拿到金蛋了！</h2>
    <div class="ribbon" id="wTitle"></div>
    <div class="tags" id="wTags"></div>
    <div class="big" id="wTime">0.0<small> 秒</small></div>
    <div class="detail" id="wDetail"></div>
    <div class="best" id="wBest"></div>
    <button class="btn green" id="bShare">分享成績截圖</button>
    <button class="btn" id="bAgain">再玩一次</button>
    <button class="btn ghost" id="bGame">分享遊戲給朋友</button>
  </div></div>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const wrap = $('wrap'), cv = $('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
const TOP = 90;          // 魔豆高度（公尺）
const SW = 0.22;         // 換藤時間
const STX = [.22, .5, .78]; // 三根藤的位置
let W = 390, H = 760, DPR = 1, PX = 47, U = 1, Yj = 420;

// ---------- 小工具 ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; }

// ---------- 音效 ----------
let AC = null, muted = LS.get('jack_mute', '0') === '1', noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = .2, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, v = .2, f1 = 800, f2 = 800, delay = 0, q = 1) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = 'bandpass'; fl.Q.value = q;
  fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(.3, d * .3)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  pop() { tone(260, .15, 'sine', .35, 620); },
  whoosh() { noise(1.4, .35, 300, 4000, 0, .7); tone(140, 1.3, 'triangle', .12, 900); },
  climb(s) { tone(s ? 600 : 500, .07, 'triangle', .13, s ? 700 : 580); noise(.06, .08, 2500, 2000); },
  coin() { tone(988, .07, 'square', .08); tone(1319, .22, 'square', .08, null, .07); },
  tweet() { tone(2300, .07, 'sine', .12, 3100); tone(2500, .07, 'sine', .12, 3300, .1); },
  crack() { noise(.3, .5, 1800, 300, 0, .8); tone(180, .25, 'sawtooth', .12, 60); },
  windWarn() { noise(1.4, .12, 300, 600, 0, .6); },
  wind() { noise(2.6, .3, 500, 900, 0, .5); },
  slip() { tone(520, .35, 'sawtooth', .1, 140); },
  swish() { noise(.15, .15, 1200, 3000, 0, 1); },
  step() { tone(150, .06, 'sine', .15, 90); },
  turn() { tone(220, .18, 'square', .08, 330); tone(330, .3, 'square', .08, 494, .16); },
  door() { tone(300, .12, 'square', .08, 200); tone(700, .25, 'square', .08, 500, .12); },
  dodge() { tone(880, .1, 'sine', .12, 1200); },
  bump() { tone(130, .12, 'sine', .25, 80); },
  sting() { tone(900, .08, 'sawtooth', .1, 1200); tone(900, .08, 'sawtooth', .1, 1300, .1); },
  cackle() { [0, .12, .24].forEach(d => tone(700 + d * 400, .1, 'square', .07, 500, d)); },
  swoosh() { noise(.5, .25, 600, 2500, 0, .8); },
  baa() { tone(320, .35, 'sawtooth', .07, 280); tone(330, .3, 'sawtooth', .05, 300, .05); },
  drop() { tone(900, .4, 'sine', .12, 200); },
  fail() { tone(392, .22, 'triangle', .22, 380); tone(370, .22, 'triangle', .22, 350, .24); tone(349, .6, 'triangle', .22, 260, .48); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .5 : .18, 'triangle', .2, null, i * .11)); }
};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- 繪圖小工具（剪紙風：每片都有柔和陰影） ----------
function sh(on = true) {
  if (on) {
    const big = on === 2;
    ctx.shadowColor = big ? 'rgba(120,64,110,.3)' : 'rgba(120,64,100,.3)';
    ctx.shadowBlur = (big ? 16 : 8) * U * DPR; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = (big ? 7 : 4) * U * DPR;
  }
  else { ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
function vg(y0, y1, c0, c1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rr(x, y, w, h, r, fill, s = true) { sh(s); ctx.fillStyle = fill; rrPath(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, fill, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, fill, rot = 0, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function poly(pts, fill, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function limb(x1, y1, x2, y2, col, w, s = true) { sh(s); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function star(x, y, r, fill) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  ctx.fillStyle = fill; ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.fill(); sh(false);
}
function archPath(x, y, w, h, fill) {
  sh(); ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + w / 2);
  ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
}
function text(s, x, y, size, fill, stroke = '#fff8ea', align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  sh(false);
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size * .28; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function bubble(x, y, s, size = 17) {
  size *= U; ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(s).width + 24 * U, h = size + 18 * U;
  const bx = clamp(x - w / 2, 8, W - w - 8);
  sh(); ctx.fillStyle = '#fff8ea'; rrPath(bx, y - h, w, h, 12 * U); ctx.fill();
  poly([[x - 7 * U, y - 2], [x + 7 * U, y - 2], [x, y + 9 * U]], '#fff8ea', false);
  text(s, bx + w / 2, y - h / 2, size, '#6b4a5a', null);
}

// ---------- 預先畫好的紙片圖層 ----------
let IMG = {}, HOUSE = { cx: 0, dy: 0 };
function make(w, h, fn) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
  const old = ctx; ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); fn(w, h); ctx = old;
  c.w = w; c.h = h; return c;
}
function paintCloud(w, h) {
  const k = w / 240;
  const blob = (pts, c0, c1) => {
    sh(); ctx.fillStyle = vg(10 * k, h, c0, c1); ctx.beginPath();
    pts.forEach(([x, y, r]) => { ctx.moveTo((x + r) * k, y * k); ctx.arc(x * k, y * k, r * k, 0, Math.PI * 2); }); ctx.fill();
  };
  blob([[145, 46, 30], [176, 56, 24], [112, 54, 24]], '#fbeef9', '#e9d6f1');
  blob([[58, 76, 32], [100, 60, 42], [146, 68, 38], [186, 84, 26], [122, 88, 34]], '#ffffff', '#fbe7f0');
  blob([[72, 96, 20], [112, 100, 22], [150, 98, 18]], '#ffffff', '#fff2f6');
  sh(false); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.2 * k; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(100 * k, 60 * k, 38 * k, Math.PI * 1.15, Math.PI * 1.7); ctx.stroke();
}
// 一層層的雲帶（參考剪紙立體感）
function paintBand(w, h, fillBottom) {
  const cols = [['#fbd5e6', '#f1b5d0'], ['#ffe2c6', '#ffcf9f'], ['#fff1cf', '#ffe3a3'], ['#fffefa', '#fff0f5']];

    text('就從巨人家偷到金蛋！', w / 2 + 60, 762, 32, '#6b4a5a', null);
    if (G.newBest) { ctx.save(); ctx.translate(560, 392); ctx.rotate(.12); rr(-90, -28, 180, 56, 18, '#fff0a8'); text('新紀錄！', 0, 0, 32, '#c2507e', null); ctx.restore(); }
    text('你能比我快嗎？', w / 2 + 60, 835, 30, '#e0679a', null);
    text(GAME_URL().replace(/^https?:\/\//, ''), w / 2, 935, 22, 'rgba(107,74,90,.75)', null);
  });
  U = oldU;
  return c;
}
let cardBlob = null;
function prepareCard() {
  cardBlob = null;
  try { resultCard().toBlob(b => { cardBlob = b; }, 'image/png'); } catch (e) {}
}
$('bShare').onclick = async () => {
  const url = GAME_URL();
  const msg = `我在《傑克與魔豆》只花 ${fmt(G.final)} 秒就從巨人家偷到金蛋！你能比我快嗎？`;
  if (cardBlob && navigator.canShare) {
    const file = new File([cardBlob], 'jack-beanstalk.png', { type: 'image/png' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: msg + ' ' + url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  if (navigator.share) {
    try { await navigator.share({ title: '傑克與魔豆', text: msg, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (cardBlob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(cardBlob); a.download = 'jack-beanstalk.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  copyText(msg + ' ' + url);
};
const shareGame = async () => {
  const url = GAME_URL(), msg = '來玩《傑克與魔豆》！爬上魔豆、躲過媽媽，看誰最快偷到巨人的金蛋！';
  if (navigator.share) {
    try { await navigator.share({ title: '傑克與魔豆', text: msg, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyText(msg + ' ' + url);
};
$('bGame').onclick = shareGame; $('bGame2').onclick = shareGame;
