<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a3524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="爬上魔豆、躲過媽媽和巨人，搶走金蛋！">
<title>傑克與魔豆</title>
<style>
:root{--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --corr:repeating-linear-gradient(180deg,rgba(110,70,30,.10) 0 2px,rgba(0,0,0,0) 2px 7px);
  --ink:#3d2b1f;--kraft:#d2ad74;--kraftD:#8f6a3c;--paper:#f7f1e3;--red:#d64f45;--teal:#2f9c95;--mustard:#f0c443}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#4a3524;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;overflow:hidden;background:#f2d65e;box-shadow:0 0 50px rgba(0,0,0,.5)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0 34px;display:flex;align-items:center;gap:8px;pointer-events:none}
.chip{background:var(--grain),var(--paper);border-radius:6px;padding:7px 14px;font-weight:900;font-size:18px;color:var(--ink);border:0;box-shadow:0 3px 0 #c9bba0,0 6px 12px rgba(40,25,10,.25);position:relative}
#timer{font-variant-numeric:tabular-nums;min-width:92px;text-align:center;transform:rotate(-1.5deg)}
#timer:after{content:"";position:absolute;left:50%;top:-8px;width:38px;height:14px;transform:translateX(-50%) rotate(4deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 4px,rgba(0,0,0,0) 4px 8px),var(--teal);opacity:.9}
#coins{color:#7a5410;font-size:15px;display:none;background:var(--grain),var(--mustard);box-shadow:0 3px 0 #b8862a,0 6px 12px rgba(40,25,10,.25);transform:rotate(1.5deg)}
#mute{margin-left:auto;pointer-events:auto;font-size:20px;cursor:pointer;font-family:inherit;line-height:1}
#hint,#chant{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--grain),var(--paper);padding:12px 18px 10px;border-radius:4px;font-weight:900;font-size:18px;text-align:center;width:max-content;max-width:88%;box-shadow:0 4px 0 #cdbfa4,0 10px 18px rgba(40,25,10,.3);opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.4}
#hint:before,#chant:before{content:"";position:absolute;left:50%;top:-9px;width:64px;height:16px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 5px,rgba(0,0,0,0) 5px 10px),var(--mustard);opacity:.92}
#hint{top:calc(env(safe-area-inset-top) + 64px)}
#chant{top:30%;font-size:26px;letter-spacing:2px;transform:translateX(-50%) rotate(1deg);color:#fff;background:var(--grain),var(--red);box-shadow:0 4px 0 #9e3029,0 10px 18px rgba(40,25,10,.3)}
#chant:before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 4px,rgba(0,0,0,0) 4px 9px),var(--teal)}
#hint.on,#chant.on{opacity:1}
.panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(40,25,10,.4)}
.panel.on{display:flex}
.card{background:var(--corr),var(--grain),linear-gradient(180deg,#dcb983,#c9a067);border-radius:12px;padding:30px 20px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 7px 0 #8f6a3c,0 24px 40px rgba(20,10,0,.5);position:relative;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.card:before{content:"";position:absolute;left:50%;top:-14px;width:120px;height:28px;transform:translateX(-50%) rotate(-2deg);background:radial-gradient(circle,rgba(255,255,255,.55) 2.5px,rgba(0,0,0,0) 3px) 0 0/12px 12px,var(--teal);opacity:.93}
.card:after{content:"";position:absolute;right:16px;bottom:12px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a8f,var(--red) 60%);box-shadow:2px 4px 3px rgba(0,0,0,.3)}
@keyframes pop{from{transform:scale(.75) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
h1{display:inline-block;margin:0 0 10px;font-size:34px;letter-spacing:4px;color:#fff;background:var(--grain),var(--red);padding:6px 18px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 5px 0 #9e3029,0 8px 14px rgba(40,25,10,.3);outline:2px solid rgba(255,255,255,.75);outline-offset:-6px}
h2{margin:0 0 6px;font-size:26px;color:var(--ink)}
.sub{font-size:16px;margin:0 0 10px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:14px;font-size:20px;font-weight:900;color:#fff;letter-spacing:1px;background:var(--grain),var(--red);box-shadow:0 5px 0 #9e3029,0 9px 16px rgba(40,25,10,.3);margin-top:12px;font-family:inherit;cursor:pointer;position:relative;outline:2px dashed rgba(255,255,255,.55);outline-offset:-7px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9e3029,0 4px 8px rgba(40,25,10,.3)}
.btn.green{background:var(--grain),var(--teal);box-shadow:0 5px 0 #1d6a65,0 9px 16px rgba(40,25,10,.3)}
.btn.green:active{box-shadow:0 2px 0 #1d6a65}
.btn.ghost{background:var(--grain),var(--mustard);color:var(--ink);font-size:17px;padding:11px;box-shadow:0 5px 0 #b8862a,0 9px 16px rgba(40,25,10,.3);outline-color:rgba(61,43,31,.35)}
.btn.ghost:active{box-shadow:0 2px 0 #b8862a}
.quote{font-size:23px;font-weight:900;line-height:1.45;margin:12px 0 10px;background:var(--grain),var(--paper);padding:14px 12px;border-radius:4px;box-shadow:0 3px 0 #cdbfa4;transform:rotate(-.8deg)}
.reason{display:inline-block;background:var(--grain),var(--red);color:#fff;border-radius:4px;padding:4px 12px;font-size:14px;font-weight:900;transform:rotate(-2deg)}
.big{font-size:58px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.1;text-shadow:0 3px 0 #fff3dc}
.big small{font-size:22px}
.ribbon{display:inline-block;margin:2px 0 8px;padding:6px 16px;border-radius:4px;background:var(--grain),var(--teal);color:#fff;font-weight:900;font-size:19px;box-shadow:0 4px 0 #1d6a65;transform:rotate(1deg)}
.ribbon:before{content:"稱號：";font-size:14px;opacity:.85}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 4px}
.tags span{font-size:13px;font-weight:900;padding:3px 10px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 4px,rgba(0,0,0,0) 4px 8px),var(--mustard);color:var(--ink);transform:rotate(-2deg)}
.tags span:nth-child(2){background:radial-gradient(circle,rgba(255,255,255,.55) 2px,rgba(0,0,0,0) 2.5px) 0 0/9px 9px,#7cc3e0;transform:rotate(2deg)}
.tags span:nth-child(3){background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 3px,rgba(0,0,0,0) 3px 7px),#e8907a}
.detail{font-size:14px;font-weight:700;opacity:.85;margin:2px 0 6px}
.best{font-size:16px;font-weight:900;margin:4px 0}
.badge{display:inline-block;background:var(--grain),var(--mustard);color:var(--ink);border-radius:50%;width:74px;height:74px;line-height:74px;padding:0;font-weight:900;font-size:15px;transform:rotate(-12deg);position:absolute;right:-10px;top:-18px;box-shadow:0 4px 0 #b8862a,0 8px 12px rgba(40,25,10,.3);outline:2px dashed rgba(61,43,31,.4);outline-offset:-6px}
.how{text-align:left;font-size:14px;line-height:1.75;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 23px,rgba(70,130,180,.22) 23px 24px),var(--grain),var(--paper);border-radius:3px;padding:8px 14px;margin:6px 0 4px;box-shadow:0 3px 0 #cdbfa4,0 6px 10px rgba(40,25,10,.2);transform:rotate(.6deg)}
.how b{color:var(--red)}
.how .pc{font-size:12.5px;opacity:.7}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:var(--grain),#3d2b1f;color:#fff;padding:10px 18px;border-radius:6px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90%;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#toast.on{opacity:1}
#shareImg{display:block;max-width:100%;max-height:42vh;margin:4px auto 6px;border-radius:6px;box-shadow:0 4px 0 #8f6a3c,0 10px 18px rgba(40,25,10,.35);transform:rotate(-1deg);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#pShare .btn{margin-top:9px;padding:12px}
.linkbtn{border:0;background:none;font-family:inherit;font-size:16px;font-weight:800;color:var(--ink);margin-top:10px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="chip" id="timer">0.0 秒</div>
    <div class="chip" id="coins">金幣 0</div>
    <button class="chip" id="mute" aria-label="靜音">🔊</button>
  </div>
  <div id="hint"></div>
  <div id="chant"></div>

  <div class="panel on" id="pTitle"><div class="card">
    <h1>傑克與魔豆</h1>
    <p class="sub">爬上魔豆、躲過媽媽，搶走巨人的金蛋！</p>
    <div class="how">
      ① 點土地種下魔豆<br>
      ② 三根藤，<b>點傑克那一根</b>往上爬（點太快會滑手）<br>
      ③ <b>點別根藤</b>就跳過去：閃開小鳥、巫婆、綿羊、豌豆，繞過斷藤、毛毛蟲、蜂窩<br>
      ④ 熱氣球飄過來時<b>跳向它</b>就能搭上！<br>
      ⑤ 大風來時<b>按住不要動</b><br>
      ⑥ 巨人摀住眼睛時<b>按住前進</b>，手放下就<b>放開</b>！<br>
      <span class="pc">電腦也能玩：用滑鼠點擊、按住</span>
    </div>
    <div class="best" id="tBest"></div>
    <button class="btn green" id="bStart">開始</button>
    <button class="btn ghost" id="bGame2">分享遊戲給朋友</button>
  </div></div>

  <div class="panel" id="pFail"><div class="card">
    <span class="reason" id="fReason"></span>
    <div class="quote" id="fQuote"></div>
    <div class="detail" id="fDetail"></div>
    <button class="btn" id="bRetry">再來一次</button>
  </div></div>

  <div class="panel" id="pWin"><div class="card">
    <div class="badge" id="wNew">新紀錄！</div>
    <h2>拿到金蛋了！</h2>
    <div class="ribbon" id="wTitle"></div>
    <div class="tags" id="wTags"></div>
    <div class="big" id="wTime">0.0<small> 秒</small></div>
    <div class="detail" id="wDetail"></div>
    <div class="best" id="wBest"></div>
    <button class="btn green" id="bShare">分享成績</button>
    <button class="btn" id="bAgain">再玩一次</button>
    <button class="btn ghost" id="bGame">分享遊戲給朋友</button>
  </div></div>

  <div class="panel" id="pShare"><div class="card">
    <h2>分享成績</h2>
    <img id="shareImg" alt="成績卡">
    <div class="detail">也可以長按圖片儲存</div>
    <button class="btn green" id="bShareImg">分享圖片＋分數</button>
    <button class="btn ghost" id="bSaveImg">儲存圖片</button>
    <button class="btn ghost" id="bShareText">只分享文字</button>
    <button class="linkbtn" id="bShareBack">← 返回</button>
  </div></div>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const wrap = $('wrap'), cv = $('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
const TOP = 90;          // 魔豆高度（公尺）
const SW = 0.22;         // 換藤時間
const STX = [.22, .5, .78]; // 三根藤的位置
let W = 390, H = 760, DPR = 1, PX = 47, U = 1, Yj = 420;

// ---------- 小工具 ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix3(a, b, c, t) { return t < .5 ? mix(a, b, t * 2) : mix(b, c, (t - .5) * 2); }
function mix(a, b, t) { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; }

// ---------- 音效 ----------
let AC = null, muted = LS.get('jack_mute', '0') === '1', noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = .2, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, v = .2, f1 = 800, f2 = 800, delay = 0, q = 1) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = 'bandpass'; fl.Q.value = q;
  fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(.3, d * .3)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  pop() { tone(260, .15, 'sine', .35, 620); },
  whoosh() { noise(1.4, .35, 300, 4000, 0, .7); tone(140, 1.3, 'triangle', .12, 900); },
  climb(s) { tone(s ? 600 : 500, .07, 'triangle', .13, s ? 700 : 580); noise(.06, .08, 2500, 2000); },
  coin() { tone(988, .07, 'square', .08); tone(1319, .22, 'square', .08, null, .07); },
  tweet() { tone(2300, .07, 'sine', .12, 3100); tone(2500, .07, 'sine', .12, 3300, .1); },
  crack() { noise(.3, .5, 1800, 300, 0, .8); tone(180, .25, 'sawtooth', .12, 60); },
  windWarn() { noise(1.4, .12, 300, 600, 0, .6); },
  wind() { noise(2.6, .3, 500, 900, 0, .5); },
  slip() { tone(520, .35, 'sawtooth', .1, 140); },
  swish() { noise(.15, .15, 1200, 3000, 0, 1); },
  step() { tone(150, .06, 'sine', .15, 90); },
  turn() { tone(220, .18, 'square', .08, 330); tone(330, .3, 'square', .08, 494, .16); },
  door() { tone(300, .12, 'square', .08, 200); tone(700, .25, 'square', .08, 500, .12); },
  dodge() { tone(880, .1, 'sine', .12, 1200); },
  bump() { tone(130, .12, 'sine', .25, 80); },
  sting() { tone(900, .08, 'sawtooth', .1, 1200); tone(900, .08, 'sawtooth', .1, 1300, .1); },
  cackle() { [0, .12, .24].forEach(d => tone(700 + d * 400, .1, 'square', .07, 500, d)); },
  swoosh() { noise(.5, .25, 600, 2500, 0, .8); },
  baa() { tone(320, .35, 'sawtooth', .07, 280); tone(330, .3, 'sawtooth', .05, 300, .05); },
  drop() { tone(900, .4, 'sine', .12, 200); },
  fail() { tone(392, .22, 'triangle', .22, 380); tone(370, .22, 'triangle', .22, 350, .24); tone(349, .6, 'triangle', .22, 260, .48); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .5 : .18, 'triangle', .2, null, i * .11)); }
};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- 繪圖小工具（剪紙風：每片都有柔和陰影） ----------
function sh(on = true) {
  if (on) {
    const big = on === 2;
    ctx.shadowColor = big ? 'rgba(120,64,110,.3)' : 'rgba(120,64,100,.3)';
    ctx.shadowBlur = (big ? 16 : 8) * U * DPR; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = (big ? 7 : 4) * U * DPR;
  }
  else { ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
function vg(y0, y1, c0, c1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rr(x, y, w, h, r, fill, s = true) { sh(s); ctx.fillStyle = fill; rrPath(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, fill, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, fill, rot = 0, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function poly(pts, fill, s = true) { sh(s); ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function limb(x1, y1, x2, y2, col, w, s = true) { sh(s); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function star(x, y, r, fill) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  ctx.fillStyle = fill; ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.fill(); sh(false);
}
function archPath(x, y, w, h, fill) {
  sh(); ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + w / 2);
  ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();

    { const cw = 440, chh = IMG.castle.h * cw / IMG.castle.w; ctx.drawImage(IMG.castle, (w - cw) / 2, 340 - chh, cw, chh); }
    ctx.drawImage(IMG.band, 0, 250, w, 190);
    card(() => rrPath(50, 380, 620, 530, 14), PAT.kraft, '#7f5a30', 6);
    card(() => rrPath(80, 412, 560, 466, 6), PAT.white, '#bfb29b', 3);
    tape(w / 2, 404, 210, 44, -.04, '#3b9c97');
    drawJack(160, 812, 1.6, 'hold', 0); drawEgg(160, 812 - 54 * 3.2, 1.7, 1);
    label(w / 2 + 60, 478, 310, 66, PAT.red, '傑克與魔豆', '#fff', -.03);
    text('稱號：' + G.title.main, w / 2 + 60, 552, 30, '#2f8f8a', null);
    text('我只花了', w / 2 + 60, 608, 30, '#3d2b1f', null);
    text(fmt(G.final) + ' 秒', w / 2 + 60, 692, 100, '#d64f45', '#fff');
    text('就從巨人家偷到金蛋！', w / 2 + 60, 774, 32, '#3d2b1f', null);
    text('你能比我快嗎？', w / 2 + 60, 840, 30, '#d64f45', null);
    if (G.newBest) { ctx.save(); ctx.translate(590, 420); ctx.rotate(.15); label(0, 0, 170, 54, PAT.yellow, '新紀錄！', '#3d2b1f'); ctx.restore(); }
    text(GAME_URL().replace(/^https?:\/\//, ''), w / 2, 938, 22, '#1f3d44', null);
  });
  U = oldU;
  return c;
}
let cardBlob = null, cardURL = '';
function prepareCard() {
  cardBlob = null;
  if (cardURL) { URL.revokeObjectURL(cardURL); cardURL = ''; }
  try { resultCard().toBlob(b => { cardBlob = b; }, 'image/png'); } catch (e) { console.warn('card', e); }
}
function shareMsg() {
  return `我在《傑克與魔豆》只花 ${fmt(G.final)} 秒就從巨人家偷到金蛋，拿到稱號「${G.title.main}」！你能比我快嗎？`;
}
$('bShare').onclick = () => {
  if (cardBlob && !cardURL) cardURL = URL.createObjectURL(cardBlob);
  $('shareImg').src = cardURL || resultCard().toDataURL('image/png');
  panel('pShare');
};
$('bShareBack').onclick = () => panel('pWin');
$('bShareImg').onclick = async () => {
  const url = GAME_URL();
  if (cardBlob && navigator.canShare) {
    const file = new File([cardBlob], 'jack-beanstalk.png', { type: 'image/png' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: shareMsg() + ' ' + url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  toast('這裡不能直接分享圖片，請按「儲存圖片」或長按圖片存起來');
};
$('bSaveImg').onclick = () => {
  const a = document.createElement('a'); a.href = $('shareImg').src; a.download = 'jack-beanstalk.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('圖片已儲存！iPhone 也可以長按圖片儲存');
};
$('bShareText').onclick = async () => {
  const url = GAME_URL();
  if (navigator.share) {
    try { await navigator.share({ title: '傑克與魔豆', text: shareMsg(), url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyText(shareMsg() + ' ' + url);
};
const shareGame = async () => {
  const url = GAME_URL(), msg = '來玩《傑克與魔豆》！爬上魔豆、躲過媽媽，看誰最快偷到巨人的金蛋！';
  if (navigator.share) {
    try { await navigator.share({ title: '傑克與魔豆', text: msg, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyText(msg + ' ' + url);
};
$('bGame').onclick = shareGame; $('bGame2').onclick = shareGame;

window.addEventListener('resize', resize);
initPats(); initStatic(); resize(); setMute(); updateTitleBest();
requestAnimationFrame(frame);
window.__game = { get G() { return G; }, get scene() { return scene; }, set scene(v) { scene = v; }, PAT, IMG };
})();
</script>
